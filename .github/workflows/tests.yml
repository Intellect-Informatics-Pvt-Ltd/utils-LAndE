# TD-125: this repo had no test workflow at all -- build.yml only packs and publishes
# NuGet packages, so its test suite had never run in CI.
#
# Trigger note (TD-39): r2-dev-stable is the branch development actually happens on, so it
# is included here. This workflow only restores/builds/tests and publishes nothing. The
# NuGet publish lives in build.yml, which stays pinned to master on purpose -- do NOT add
# r2-dev-stable or pull_request there, because its script forces PUSH_PACKAGES=true for
# any event that is not workflow_dispatch.
name: Tests

# PARKED 2026-08-19 - manual trigger only.
#
# These suites were switched on estate-wide (TD-84/TD-125) and then failed at
# restore with 401 Unauthorized against the private GitHub Packages feed
# (TD-127). Authentication was added and hardened, but nobody working on it can
# read the Actions logs, so it could not be confirmed fixed. Rather than leave
# 30 repos flashing red on every push, the automatic triggers are parked here.
#
# TO RE-ENABLE: delete the `on:` block below and restore the commented one.
# Before you do, run this workflow manually once and read the restore step.
# If it still 401s, the org secret GITHUB_PACKAGES_PAT is almost certainly
# required - the built-in GITHUB_TOKEN cannot always read another repository's
# packages.
#
# The parked triggers were:
#   on:
#     push:
#       branches: [main, master, develop, r2-dev-stable, 'feature/**']
#     pull_request:
#       branches: [main, master, develop, r2-dev-stable]
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Intellect.* packages come from the org's PRIVATE GitHub Packages feed
      # (NuGet.Config -> source "github"), so a bare `dotnet restore` returns
      # 401 Unauthorized. Mirrors configure_github_packages_source() in
      # build_push_script.sh: prefer the org PAT, fall back to the job's token.
      #
      # Tolerant on purpose: a repo with no NuGet.Config, or one without a
      # "github" source, skips instead of failing the job. If the feed really was
      # needed, restore says so with a 401 - which is the honest error.
      - name: Authenticate GitHub Packages feed
        env:
          FEED_TOKEN: ${{ secrets.GITHUB_PACKAGES_PAT || github.token }}
        run: |
          set -euo pipefail
          if [ ! -f NuGet.Config ]; then
            echo "::notice::no root NuGet.Config - nothing to authenticate"
            exit 0
          fi
          if ! grep -q 'key="github"' NuGet.Config; then
            echo "::notice::no 'github' package source - skipping authentication"
            exit 0
          fi
          dotnet nuget update source github \
            --configfile NuGet.Config \
            --source https://nuget.pkg.github.com/Intellect-Informatics-Pvt-Ltd/index.json \
            --username "${{ github.actor }}" \
            --password "$FEED_TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore Intellect.Erp.Observability.sln

      - name: Build
        run: dotnet build Intellect.Erp.Observability.sln --no-restore --configuration Release

      - name: Test (unit)
        run: >-
          dotnet test Intellect.Erp.Observability.sln
          --no-build --configuration Release
          --verbosity normal
          --filter "FullyQualifiedName!~Integration"
          --logger "trx;LogFileName=unit-test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults/unit"

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Intellect.* packages come from the org's PRIVATE GitHub Packages feed
      # (NuGet.Config -> source "github"), so a bare `dotnet restore` returns
      # 401 Unauthorized. Mirrors configure_github_packages_source() in
      # build_push_script.sh: prefer the org PAT, fall back to the job's token.
      #
      # Tolerant on purpose: a repo with no NuGet.Config, or one without a
      # "github" source, skips instead of failing the job. If the feed really was
      # needed, restore says so with a 401 - which is the honest error.
      - name: Authenticate GitHub Packages feed
        env:
          FEED_TOKEN: ${{ secrets.GITHUB_PACKAGES_PAT || github.token }}
        run: |
          set -euo pipefail
          if [ ! -f NuGet.Config ]; then
            echo "::notice::no root NuGet.Config - nothing to authenticate"
            exit 0
          fi
          if ! grep -q 'key="github"' NuGet.Config; then
            echo "::notice::no 'github' package source - skipping authentication"
            exit 0
          fi
          dotnet nuget update source github \
            --configfile NuGet.Config \
            --source https://nuget.pkg.github.com/Intellect-Informatics-Pvt-Ltd/index.json \
            --username "${{ github.actor }}" \
            --password "$FEED_TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore Intellect.Erp.Observability.sln

      - name: Build
        run: dotnet build Intellect.Erp.Observability.sln --no-restore --configuration Release

      # These need a Docker daemon (Testcontainers) or a live MySQL; ubuntu-latest
      # provides Docker. Kept in a separate job so an infrastructure failure here
      # cannot be mistaken for a unit-test regression.

      - name: Test (integration -- requires Docker)
        run: >-
          dotnet test tests/Intellect.Erp.Observability.IntegrationTests/Intellect.Erp.Observability.IntegrationTests.csproj
          --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults/integration"

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/integration
